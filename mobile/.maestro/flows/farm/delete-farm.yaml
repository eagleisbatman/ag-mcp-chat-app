appId: org.digitalgreen.agmcp
name: "Farm - Delete Farm (Cancel to Preserve Data)"
tags:
  - farm
  - regression
properties:
  testCaseId: "TC-FARM-005"
  priority: "Medium"
---
# TC-FARM-005: Verify the delete confirmation dialog appears when deleting a farm.
# Cancels at the dialog to preserve test data.
# Requires at least one farm to exist.

- startRecording: "farm-delete"

- runScript: ../../scripts/page-objects.js

- runFlow: ../../subflows/ensure-logged-in.yaml

# Navigate to Farms via hamburger menu → Settings → My Farms
- tapOn:
    id: ${output.chat.settings}
- extendedWaitUntil:
    visible: "Settings"
    timeout: 8000
- tapOn:
    text: "My Farms"
- extendedWaitUntil:
    visible: ".*Farms.*|.*farm.*"
    timeout: 8000
- takeScreenshot: "farm-delete-01-farms-list"

# Tap on the first farm
- tapOn:
    text: ".*Farm.*|.*farm.*"
    index: 0
    optional: true
- takeScreenshot: "farm-delete-02-farm-detail"

# Scroll to find the Delete action
- scrollUntilVisible:
    element: "Delete|Remove"
    direction: DOWN
    timeout: 8000
- tapOn:
    text: "Delete Farm|Delete"
    optional: true
- takeScreenshot: "farm-delete-03-delete-tapped"

# Verify confirmation dialog
- runFlow:
    when:
      visible: "sure|confirm|delete|cannot be undone|permanent"
    commands:
      - takeScreenshot: "farm-delete-04-confirmation-dialog"
      - assertWithAI: "A confirmation dialog warns the user about farm deletion with Cancel and Delete buttons visible."
        optional: true
      # Cancel to preserve data
      - tapOn:
          text: "Cancel|No|Keep"
          optional: true
      - takeScreenshot: "farm-delete-05-cancelled"

# Verify farm is still present
- assertVisible:
    text: ".*Farm.*"
    optional: true
- takeScreenshot: "farm-delete-06-farm-preserved"

- stopRecording
