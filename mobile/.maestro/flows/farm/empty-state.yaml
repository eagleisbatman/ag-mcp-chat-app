appId: org.digitalgreen.agmcp
name: "Farm - Empty State (No Farms)"
tags:
  - farm
  - regression
properties:
  testCaseId: "TC-FARM-001"
  priority: "Medium"
---
# TC-FARM-001: Navigate to Farms via hamburger menu on a fresh account and verify
# the empty state UI is present and the Add Farm button is visible.
#
# Note: Uses ensure-logged-in, NOT clearState (breaks iOS Metro connection).
# If the account already has farms the empty state won't show — the flow
# still verifies the farm list screen loads without defects.

- startRecording: "farm-empty-state"

- runScript: ../../scripts/page-objects.js

- runFlow: ../../subflows/ensure-logged-in.yaml

# Navigate to Farms via hamburger menu → Settings → My Farms
- tapOn:
    id: ${output.chat.settings}
- extendedWaitUntil:
    visible: "Settings"
    timeout: 8000
- tapOn:
    text: "My Farms"
- extendedWaitUntil:
    visible: ".*Farms.*|.*farm.*|.*Add.*"
    timeout: 8000
- takeScreenshot: "farm-empty-01-farms-screen"

- assertVisible:
    text: "My Farms"
    optional: true
- assertNoDefectsWithAI:
    optional: true

# The Add Farm button (farm-add) should always be visible whether or not farms exist
- assertVisible:
    id: ${output.farm.add}
    optional: true

- assertWithAI: "The Farms screen shows either an empty state with a message like 'No farms yet' and a CTA to add a farm, or a list of existing farms. The UI should be clean with no visual defects."
  optional: true

- takeScreenshot: "farm-empty-02-final"

- stopRecording
